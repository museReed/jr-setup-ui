<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>jr-setup-ui</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        background: #f5f5f5;
        color: #202020;
      }

      body {
        margin: 0;
        padding: 32px 20px;
      }

      main {
        max-width: 760px;
        margin: 0 auto;
      }

      .env-check {
        overflow: hidden;
        margin: 0 0 28px;
        border: 1px solid #b8c3cc;
        border-top: 4px solid #315f86;
        border-radius: 6px;
        background: #fff;
      }

      .env-heading {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
        padding: 18px 20px 16px;
      }

      .env-heading h2 {
        margin: 0;
      }

      #env-os {
        margin: 6px 0 0;
        color: #4d5963;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.9rem;
      }

      .env-results {
        border-top: 1px solid #d8dee3;
      }

      .install-status {
        margin: 0 20px 16px;
        padding: 12px 14px;
        border: 1px solid #4d7a58;
        border-radius: 4px;
        background: #e5f3e8;
        color: #174f25;
        font-weight: 700;
      }

      .install-status.failed {
        border-color: #a94a4a;
        background: #fae8e8;
        color: #8b2020;
      }

      .install-status button {
        margin-left: 10px;
      }

      .env-row {
        display: grid;
        grid-template-columns: 26px minmax(170px, 0.8fr) 1fr auto;
        align-items: center;
        gap: 10px;
        min-height: 42px;
        padding: 5px 20px;
        border-bottom: 1px solid #e5e8eb;
      }

      .env-row:last-child {
        border-bottom: 0;
      }

      .env-icon {
        display: inline-grid;
        width: 22px;
        height: 22px;
        place-items: center;
        border: 1px solid currentColor;
        border-radius: 50%;
        font-weight: 700;
        line-height: 1;
      }

      .env-detail {
        color: #4d5963;
      }

      .env-row[data-status="ok"] .env-icon {
        background: #e5f3e8;
        color: #17652a;
      }

      .env-row[data-status="missing"] .env-icon {
        background: #fae8e8;
        color: #9b2525;
      }

      .env-row[data-status="warn"] .env-icon {
        background: #fff2d5;
        color: #805800;
      }

      .env-message {
        margin: 0;
        padding: 18px 20px;
        color: #4d5963;
      }

      .env-message.failed {
        color: #9b2525;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 12px 0 24px;
      }

      button {
        padding: 9px 14px;
        border: 1px solid #777;
        border-radius: 4px;
        background: #fff;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.5;
      }

      textarea {
        width: 100%;
        min-height: 110px;
        box-sizing: border-box;
        padding: 10px;
        border: 1px solid #777;
        border-radius: 4px;
        font: inherit;
        resize: vertical;
      }

      .write-toggle {
        margin: 10px 0 0;
      }

      .write-toggle small {
        display: block;
        margin-top: 3px;
        color: #555;
      }

      .run-controls {
        display: flex;
        justify-content: flex-end;
        min-height: 38px;
        margin-bottom: 10px;
      }

      #cancel {
        border-color: #a32929;
        color: #a32929;
      }

      .login-hints {
        margin-bottom: 10px;
        padding: 16px;
        border: 2px solid #315f86;
        border-radius: 4px;
        background: #eaf3fa;
      }

      .login-hints a {
        overflow-wrap: anywhere;
        color: #174f7a;
        font-weight: 700;
      }

      .login-code-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 12px;
      }

      #login-code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 1.8rem;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      #output {
        height: 320px;
        overflow-y: auto;
        box-sizing: border-box;
        margin: 0;
        padding: 14px;
        border-radius: 4px;
        background: #171717;
        color: #e7e7e7;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        white-space: pre-wrap;
      }

      .run-input {
        display: flex;
        gap: 10px;
        margin-top: 10px;
      }

      .run-input input {
        min-width: 0;
        flex: 1;
        box-sizing: border-box;
        padding: 9px 10px;
        border: 1px solid #777;
        border-radius: 4px;
        font: inherit;
      }

      .stderr,
      .failed {
        color: #ff8a8a;
      }

      .succeeded {
        color: #79d68b;
      }

      .agent-status {
        color: #a3a3a3;
      }

      .agent-tool {
        overflow-x: auto;
        margin: 5px 0;
        padding: 5px 8px;
        border-radius: 3px;
        background: #303030;
        white-space: nowrap;
      }

      .agent-text {
        margin: 5px 0;
        color: #fff;
      }

      .agent-error {
        color: #ff8a8a;
      }

      @media (max-width: 560px) {
        body {
          padding: 20px 14px;
        }

        .env-heading {
          align-items: stretch;
          flex-direction: column;
          gap: 14px;
        }

        .env-heading button {
          align-self: flex-start;
        }

        .env-row {
          grid-template-columns: 26px 1fr;
          padding: 9px 16px;
        }

        .env-detail {
          grid-column: 2;
        }

        .env-action {
          grid-column: 2;
          justify-self: start;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>jr-setup-ui</h1>
      <section class="env-check" aria-labelledby="env-title">
        <div class="env-heading">
          <div>
            <h2 id="env-title">環境檢查</h2>
            <p id="env-os">作業系統：檢查中…</p>
          </div>
          <button type="button" id="recheck-env">重新檢查</button>
        </div>
        <p id="install-status" class="install-status" hidden>
          安裝完成，狀態已更新。
        </p>
        <p id="login-wait-status" class="install-status" hidden></p>
        <div
          id="env-results"
          class="env-results"
          aria-live="polite"
          aria-busy="true"
        >
          <p class="env-message">檢查中…</p>
        </div>
      </section>
      <h2>固定步驟</h2>
      <div class="actions">
        <button type="button" data-action="hello">顯示問候</button>
        <button type="button" data-action="slow-count">慢速計數</button>
        <button type="button" data-action="fail-demo">失敗示範</button>
        <button type="button" data-action="claude-hello">Claude 問候</button>
        <button type="button" data-action="codex-hello">Codex 問候</button>
      </div>
      <h2>自由輸入</h2>
      <textarea
        id="prompt"
        maxlength="4000"
        placeholder="輸入要交給代理執行的內容"
      ></textarea>
      <div class="write-toggle">
        <label>
          <input type="checkbox" id="allow-write" />
          允許寫檔（預設關閉）
        </label>
        <small>關閉時只能讀取與查詢，不能建立或修改檔案。</small>
      </div>
      <div class="actions">
        <button type="button" data-action="claude-free">送給 Claude</button>
        <button type="button" data-action="codex-free">送給 Codex</button>
      </div>
      <div class="run-controls">
        <button type="button" id="cancel" hidden>取消</button>
      </div>
      <div id="login-hints" class="login-hints" hidden>
        <a
          id="login-url"
          target="_blank"
          rel="noopener noreferrer"
          hidden
        ></a>
        <div id="login-code-row" class="login-code-row" hidden>
          <span id="login-code"></span>
          <button type="button" id="copy-login-code">複製</button>
        </div>
      </div>
      <div id="output" role="log" aria-live="polite"></div>
      <form id="run-input" class="run-input" hidden>
        <input
          id="run-input-text"
          type="text"
          maxlength="500"
          autocomplete="off"
          aria-label="送給執行中指令的文字"
        />
        <button type="submit">送出</button>
      </form>
    </main>

    <script>
      const token = new URLSearchParams(window.location.search).get("t") ?? "";
      const output = document.querySelector("#output");
      const buttons = [...document.querySelectorAll("[data-action]")];
      const prompt = document.querySelector("#prompt");
      const allowWrite = document.querySelector("#allow-write");
      const cancelButton = document.querySelector("#cancel");
      const envOs = document.querySelector("#env-os");
      const envResults = document.querySelector("#env-results");
      const recheckEnvButton = document.querySelector("#recheck-env");
      const installStatus = document.querySelector("#install-status");
      const loginWaitStatus = document.querySelector("#login-wait-status");
      const loginHints = document.querySelector("#login-hints");
      const loginUrl = document.querySelector("#login-url");
      const loginCodeRow = document.querySelector("#login-code-row");
      const loginCode = document.querySelector("#login-code");
      const copyLoginCodeButton = document.querySelector("#copy-login-code");
      const runInput = document.querySelector("#run-input");
      const runInputText = document.querySelector("#run-input-text");
      const loginCheckIds = {
        "login-claude": "claude-auth",
        "login-codex": "codex-auth",
        "login-gh": "gh-auth",
      };
      const loginPollInterval = 5_000;
      const loginWaitTimeout = 5 * 60_000;
      let activeText = null;
      let currentAgentName = "";
      let currentRunId = null;
      let activeEnvButton = null;
      let currentEnvAction = null;
      let envCheckInProgress = false;
      let loginWait = null;
      let runInProgress = false;
      let currentAcceptsInput = false;

      function extractLoginHints(text) {
        if (typeof text !== "string") {
          return { url: null, code: null };
        }

        const urlMatch = text.match(/https:\/\/\S+/);
        const codeMatch = text.match(/\b[A-Z0-9]{4}-[A-Z0-9]{4}\b/i);

        return {
          url:
            urlMatch === null ? null : urlMatch[0].replace(/[.,)]+$/, ""),
          code: codeMatch === null ? null : codeMatch[0],
        };
      }

      function clearLoginHints() {
        loginUrl.hidden = true;
        loginUrl.removeAttribute("href");
        loginUrl.textContent = "";
        loginCodeRow.hidden = true;
        loginCode.textContent = "";
        copyLoginCodeButton.textContent = "複製";
        loginHints.hidden = true;
      }

      function showLoginHints(text) {
        const hints = extractLoginHints(text);

        if (hints.url !== null) {
          loginUrl.href = hints.url;
          loginUrl.textContent = hints.url;
          loginUrl.hidden = false;
        }

        if (hints.code !== null) {
          loginCode.textContent = hints.code;
          loginCodeRow.hidden = false;
        }

        loginHints.hidden = loginUrl.hidden && loginCodeRow.hidden;
      }

      function showInstallStatus(message, failed = false) {
        installStatus.textContent = message;
        installStatus.classList.toggle("failed", failed);
        installStatus.hidden = false;
      }

      function updateEnvActionButtons() {
        for (const button of document.querySelectorAll(
          "[data-install-action], [data-fix-action]",
        )) {
          const action =
            button.dataset.installAction ?? button.dataset.fixAction;
          const waiting = loginWait?.action === action;
          button.disabled = runInProgress || waiting;
          button.textContent = waiting
            ? "等待登入中…"
            : runInProgress && action === currentEnvAction
              ? `${button.dataset.idleText}中…`
              : button.dataset.idleText;
        }
      }

      function clearLoginWait() {
        if (loginWait !== null) {
          window.clearTimeout(loginWait.timerId);
          loginWait = null;
        }

        updateEnvActionButtons();
      }

      function stopLoginWait() {
        clearLoginWait();
        loginWaitStatus.hidden = true;
        loginWaitStatus.replaceChildren();
      }

      function finishLoginWait(message, failed = false) {
        clearLoginWait();
        loginWaitStatus.textContent = message;
        loginWaitStatus.classList.toggle("failed", failed);
        loginWaitStatus.hidden = false;
      }

      function showLoginWaitingStatus() {
        const message = document.createTextNode(
          "正在確認登入狀態，完成後這裡會自動更新。",
        );
        const stopButton = document.createElement("button");
        stopButton.type = "button";
        stopButton.textContent = "停止等待";
        stopButton.addEventListener("click", stopLoginWait);
        loginWaitStatus.replaceChildren(message, stopButton);
        loginWaitStatus.classList.remove("failed");
        loginWaitStatus.hidden = false;
      }

      function handleLoginChecks(checks) {
        if (
          loginWait !== null &&
          checks.find((check) => check.id === loginWait.checkId)?.status ===
            "ok"
        ) {
          finishLoginWait("登入成功。");
        }
      }

      async function checkEnvironment(showLoading = true) {
        if (envCheckInProgress) {
          return null;
        }

        envCheckInProgress = true;
        recheckEnvButton.disabled = true;
        envResults.setAttribute("aria-busy", "true");

        if (showLoading) {
          const loading = document.createElement("p");
          loading.className = "env-message";
          loading.textContent = "檢查中…";
          envResults.replaceChildren(loading);
        }

        try {
          const response = await fetch(
            `/env?t=${encodeURIComponent(token)}`,
          );

          if (!response.ok) {
            throw new Error(await response.text());
          }

          const { os, checks } = await response.json();
          envOs.textContent = `作業系統：${os.platform} / ${os.arch}`;
          const statusDisplay = {
            ok: { symbol: "✓", label: "通過" },
            missing: { symbol: "✗", label: "缺少" },
            warn: { symbol: "!", label: "需處理" },
          };
          const rows = checks.map((check) => {
            const row = document.createElement("div");
            row.className = "env-row";
            row.dataset.status = check.status;

            const icon = document.createElement("span");
            const display = statusDisplay[check.status];
            icon.className = "env-icon";
            icon.textContent = display.symbol;
            icon.setAttribute("aria-label", display.label);

            const label = document.createElement("strong");
            label.textContent = check.label;

            const detail = document.createElement("span");
            detail.className = "env-detail";
            detail.textContent = check.detail;

            row.append(icon, label, detail);

            const envActions = [
              {
                action: check.installAction,
                dataName: "installAction",
                text: "安裝",
              },
              {
                action: check.fixAction,
                dataName: "fixAction",
                text: check.id === "execution-policy" ? "修正" : "登入",
              },
            ];

            for (const envAction of envActions) {
              if (envAction.action === null) {
                continue;
              }

              const actionButton = document.createElement("button");
              actionButton.type = "button";
              actionButton.className = "env-action";
              actionButton.dataset[envAction.dataName] = envAction.action;
              actionButton.dataset.idleText = envAction.text;
              actionButton.textContent = envAction.text;
              actionButton.addEventListener("click", () => {
                run(envAction.action, undefined, actionButton);
              });
              row.append(actionButton);
            }

            return row;
          });
          envResults.replaceChildren(...rows);
          updateEnvActionButtons();
          handleLoginChecks(checks);
          return checks;
        } catch (error) {
          envOs.textContent = "作業系統：無法取得";
          const message = document.createElement("p");
          message.className = "env-message failed";
          message.textContent = `環境檢查失敗：${error.message}`;
          envResults.replaceChildren(message);
          return null;
        } finally {
          envCheckInProgress = false;
          envResults.setAttribute("aria-busy", "false");
          recheckEnvButton.disabled = runInProgress;
        }
      }

      async function pollLogin(wait) {
        if (loginWait !== wait) {
          return;
        }

        if (Date.now() - wait.startedAt >= loginWaitTimeout) {
          finishLoginWait(
            "等待逾時，請確認登入是否完成，或按重新檢查。",
            true,
          );
          return;
        }

        await checkEnvironment(false);

        if (loginWait !== wait) {
          return;
        }

        wait.timerId = window.setTimeout(
          () => pollLogin(wait),
          loginPollInterval,
        );
      }

      function startLoginWait(action) {
        stopLoginWait();
        const wait = {
          action,
          checkId: loginCheckIds[action],
          startedAt: Date.now(),
          timerId: null,
        };
        loginWait = wait;
        showLoginWaitingStatus();
        updateEnvActionButtons();
        wait.timerId = window.setTimeout(
          () => pollLogin(wait),
          loginPollInterval,
        );
      }

      function setRunning(running) {
        runInProgress = running;

        for (const button of buttons) {
          button.disabled = running;
        }

        recheckEnvButton.disabled = running || envCheckInProgress;
        updateEnvActionButtons();

        prompt.disabled = running;
        allowWrite.disabled = running;
        cancelButton.hidden = !running;
        cancelButton.disabled = !running || currentRunId === null;
        runInput.hidden =
          !running || currentRunId === null || !currentAcceptsInput;
      }

      function addLine(text, className = "") {
        const line = document.createElement("div");
        line.textContent = text;
        line.className = className;
        output.append(line);
        output.scrollTop = output.scrollHeight;
      }

      function addAgentEvent(agentEvent) {
        if (agentEvent.kind === "text") {
          if (activeText === null) {
            activeText = document.createElement("div");
            activeText.className = "agent-text";
            activeText.textContent = `${currentAgentName} 回覆：`;
            output.append(activeText);
          }

          activeText.append(document.createTextNode(agentEvent.text));
          output.scrollTop = output.scrollHeight;
          return;
        }

        activeText = null;
        addLine(agentEvent.text, `agent-${agentEvent.kind}`);
      }

      async function run(action, promptText, envButton = null) {
        if (action.startsWith("login-")) {
          stopLoginWait();
        }

        output.replaceChildren();
        clearLoginHints();
        activeText = null;
        activeEnvButton = envButton;
        currentEnvAction = envButton === null ? null : action;

        if (activeEnvButton !== null) {
          installStatus.hidden = true;
        }

        currentAgentName = action.startsWith("claude")
          ? "Claude"
          : action.startsWith("codex")
            ? "Codex"
            : "";
        currentRunId = null;
        currentAcceptsInput = false;
        setRunning(true);

        try {
          const body = { action };

          if (promptText !== undefined) {
            body.prompt = promptText;

            if (allowWrite.checked) {
              body.allowWrite = true;
            }
          }

          const response = await fetch(`/run?t=${encodeURIComponent(token)}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });

          if (!response.ok) {
            throw new Error(await response.text());
          }

          const { runId, acceptsInput } = await response.json();
          currentRunId = runId;
          currentAcceptsInput = acceptsInput;
          setRunning(true);
          const streamUrl =
            `/stream?runId=${encodeURIComponent(runId)}` +
            `&t=${encodeURIComponent(token)}`;
          const events = new EventSource(streamUrl);
          let done = false;

          events.addEventListener("line", (event) => {
            const line = JSON.parse(event.data);

            if (action.startsWith("login-")) {
              showLoginHints(line.text);
            }

            addLine(line.text, line.stream === "stderr" ? "stderr" : "");
          });

          events.addEventListener("agent", (event) => {
            addAgentEvent(JSON.parse(event.data));
          });

          events.addEventListener("done", (event) => {
            done = true;
            const result = JSON.parse(event.data);
            // benign：安裝器回報「已經裝好了／沒有可用更新」，那不是失敗。
            const succeeded = result.exitCode === 0 || result.benign === true;
            const summary =
              result.signal === null
                ? `exit code: ${result.exitCode}`
                : `已停止：${result.signal}`;
            addLine(
              summary,
              succeeded ? "succeeded" : "failed",
            );

            if (activeEnvButton !== null) {
              if (!succeeded) {
                showInstallStatus(
                  action.startsWith("install-")
                    ? "安裝失敗，請看下方輸出"
                    : "執行失敗，請看下方輸出",
                  true,
                );
              }
            }

            events.close();
            clearLoginHints();
            currentRunId = null;
            currentAcceptsInput = false;
            setRunning(false);
            activeEnvButton = null;
            currentEnvAction = null;

            if (envButton !== null && succeeded) {
              if (action.startsWith("login-")) {
                startLoginWait(action);
              } else {
                showInstallStatus(
                  action === "fix-execution-policy"
                    ? "已改為 RemoteSigned，狀態已更新。"
                    : result.benign === true
                      ? "這個項目本來就已經裝好了，狀態已更新。"
                      : "安裝完成，狀態已更新。",
                );
                checkEnvironment();
              }
            }
          });

          events.onerror = () => {
            if (!done) {
              addLine("串流連線中斷", "failed");
              events.close();
              clearLoginHints();
              currentRunId = null;
              currentAcceptsInput = false;
              setRunning(false);
              activeEnvButton = null;
              currentEnvAction = null;
            }
          };
        } catch (error) {
          addLine(`無法執行：${error.message}`, "failed");
          clearLoginHints();
          currentRunId = null;
          currentAcceptsInput = false;
          setRunning(false);
          activeEnvButton = null;
          currentEnvAction = null;
        }
      }

      for (const button of buttons) {
        button.addEventListener("click", () => {
          const action = button.dataset.action;
          run(action, action.endsWith("-free") ? prompt.value : undefined);
        });
      }

      cancelButton.addEventListener("click", async () => {
        if (currentRunId === null) {
          return;
        }

        cancelButton.disabled = true;

        try {
          const response = await fetch(
            `/cancel?t=${encodeURIComponent(token)}`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ runId: currentRunId }),
            },
          );

          if (!response.ok) {
            throw new Error(await response.text());
          }

          clearLoginHints();
          addLine("正在取消…", "agent-status");
        } catch (error) {
          addLine(`無法取消：${error.message}`, "failed");
          cancelButton.disabled = false;
        }
      });

      copyLoginCodeButton.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(loginCode.textContent);
          copyLoginCodeButton.textContent = "已複製";
        } catch (error) {
          addLine(`無法複製：${error.message}`, "failed");
        }
      });

      runInput.addEventListener("submit", async (event) => {
        event.preventDefault();

        if (currentRunId === null || !currentAcceptsInput) {
          return;
        }

        const text = runInputText.value;
        const runId = currentRunId;

        try {
          const response = await fetch(`/input?t=${encodeURIComponent(token)}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ runId, text }),
          });

          if (!response.ok) {
            throw new Error(await response.text());
          }

          addLine(`> ${text}`, "agent-status");
          runInputText.value = "";
        } catch (error) {
          addLine(`無法送出：${error.message}`, "failed");
        }
      });

      recheckEnvButton.addEventListener("click", () => checkEnvironment());
      checkEnvironment();
    </script>
  </body>
</html>
