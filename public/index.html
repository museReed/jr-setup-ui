<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>jr-setup-ui</title>
    <link rel="stylesheet" href="/vendor/design-system.css" />
    <link rel="stylesheet" href="/vendor/driver.css" />
    <!-- 操作步驟彈窗裡「畫出來的畫面」。自成一體、不吃 design-system 的變數，
         所以 copy-studio 那邊載同一個檔畫出來的東西一模一樣。 -->
    <link rel="stylesheet" href="/mocks.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <script>
      fetch("/vendor/logos.svg")
        .then((response) => response.text())
        .then((sprite) => {
          const holder = document.createElement("div");
          holder.innerHTML = sprite;
          document.body.prepend(holder.firstElementChild);
        });
    </script>
    <main class="wizard-layout">
      <!-- tab 與進度條包在同一個 sticky 容器裡。分開各自 sticky 的話，兩者之間
           會露出一條縫，底下捲動的卡片內容會從縫裡透出來。 -->
      <div class="sticky-top-stack">
      <nav id="section-nav" class="section-tabs" aria-label="設定章節">
        <button type="button" class="section-tab current" data-section-target="env" aria-current="step">
          <span>讓 AI 能跑起來</span>
        </button>
        <button type="button" class="section-tab" data-section-target="rules">
          <span>讓它照你的規矩回話</span>
        </button>
        <button type="button" class="section-tab" data-section-target="skills">
          <span>給它技能包</span>
        </button>
        <button type="button" class="section-tab" data-section-target="demo">
          <span>跑一次給你看</span>
        </button>
        <button type="button" class="section-tab" data-section-target="notes">
          <span>把筆記存起來</span>
        </button>
      </nav>
      <p id="section-lock-message" class="section-lock-message" hidden></p>

      <div class="milestone-wrap">
        <div class="milestone-heading">
          <small id="section-status" aria-live="polite">正在檢查目前進度…</small>
          <button type="button" id="replay-tour" class="ds-btn-fill is-sm"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 11v5M12 7.5v.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>這頁怎麼用</span></button>
          <!-- 分頁鎖頭的狀態變化紀錄。學生看到怪畫面時按一下，整包貼給助教就查得到
               是哪一個瞬間算錯的（見 view.js 的 lockDiagnostics）。 -->
          <button type="button" id="copy-diagnostics" class="ds-btn-fill is-sm"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 9h9v11H9zM6 15H5V4h10v1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>複製診斷資料</span></button>
        </div>
        <div id="milestone-bar" class="ds-pbar ds-pbar--milestones" data-base="0">
          <div id="milestone-fill" class="ds-pbar-fill" role="progressbar" aria-label="本段卡片進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
          <!-- 走在進度條上的那隻。原本是設計系統的小鴨（SVG，跟著主題變色），
               Reed 指定換成 black rainbow cat 這支 lottie。它是 33 張 PNG 逐格播，
               顏色寫死了，所以不再跟著主題走——這是換掉時就知道的代價。
               動畫本身面向左邊，水平翻轉交給 CSS（見 .milestone-cat），不改 JSON。 -->
          <div id="milestone-duck" class="ds-duck walk" style="left: 0%">
            <div class="ds-duck-hop">
              <span id="milestone-cat" class="milestone-cat" aria-hidden="true"></span>
            </div>
          </div>
        </div>
      </div>
      </div>

      <div class="wizard-workspace">
        <div class="task-terminal-layout">
          <section class="task-column" data-section-panel aria-label="目前設定卡片">
            <div id="config-choice-panel" class="config-choice-panel" hidden>
              <div>
                <strong>要設定哪些工具？</strong>
                <div id="config-tools" aria-label="選擇工具"></div>
              </div>
              <div>
                <strong>規則檔用哪個語言？</strong>
                <div id="config-lang" aria-label="選擇語言"></div>
              </div>
              <div class="config-toolbar-status">
                <span id="config-summary">尚未檢查</span>
                <button type="button" id="recheck-configs" class="ds-btn-fill is-sm"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>重新檢查</span></button>
              </div>
            </div>

            <div id="current-card" aria-live="polite" aria-busy="true"></div>
            <div id="env-results" hidden></div>
            <div id="config-results" hidden></div>
            <p id="env-os" hidden>作業系統：檢查中…</p>
            <button type="button" id="recheck-env" class="ds-btn-fill is-sm" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>重新檢查</span></button>
            <p id="install-status" hidden></p>
            <p id="login-wait-status" hidden></p>
          </section>

          <section id="terminal" class="ds-term ds-term--typing terminal-column" aria-label="執行狀態">
            <div class="ds-term-chrome">
              <span class="ds-term-dot" style="background: var(--red-4)" aria-hidden="true"></span>
              <span class="ds-term-dot" style="background: var(--amber-4)" aria-hidden="true"></span>
              <span class="ds-term-dot" style="background: var(--teal-4)" aria-hidden="true"></span>
              <span class="terminal-title">現在正在做什麼</span>
              <span id="terminal-mascot" class="terminal-mascot" aria-hidden="true"></span>
              <button type="button" id="cancel" class="ds-btn-fill is-sm is-on-dark" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>取消</span></button>
            </div>
            <div id="terminal-lines" class="ds-term-body" role="log" aria-live="polite">
              <div class="ds-term-line ds-term-line--dim">選一張卡開始，這裡會用白話更新進度。</div>
            </div>
            <details id="raw-output-details">
              <summary>看原始輸出</summary>
              <!-- 按鈕放在 summary 外面：放進去的話點它會順手把面板收起來，學生按
                   「複製」看到的是內容消失。靠 styles.css 的絕對定位疊回同一列右邊。 -->
              <button type="button" id="copy-raw-output" class="ds-btn-fill is-sm is-on-dark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 9h9v11H9zM6 15H5V4h10v1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>copy</span></button>
              <pre id="output"></pre>
            </details>
          </section>
        </div>

        <!-- 翻頁按鈕排在卡片下方，左右各自貼齊卡片與終端的外緣。放在卡片裡的話，
             每張卡高度不同，按鈕就會上下跳，學生每翻一張都要重新找它在哪。 -->
        <div id="wizard-nav-row" class="wizard-nav-row">
          <button type="button" id="wizard-prev" class="ds-btn-fill is-primary wizard-nav wizard-nav--prev" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="wizard-nav-label">上一張</span>
          </button>
          <!-- 下一張那顆包一層：解鎖時巫師與爆炸要疊在它的位置上演，而按鈕本身在
               那段期間是隱形的（特效不能跟著一起被藏掉，所以不能塞在按鈕裡面）。 -->
          <span id="wizard-next-slot" class="wizard-nav-slot">
            <span id="wizard-unlock" class="wizard-unlock" aria-hidden="true"></span>
            <button type="button" id="wizard-next" class="ds-btn-fill is-primary wizard-nav wizard-nav--next" hidden>
              <span class="wizard-nav-label">下一張</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </span>
        </div>
      </div>
    </main>

    <div id="verify-modal" class="ds-modal-overlay" hidden>
      <section class="ds-modal-panel" role="dialog" aria-modal="true" aria-labelledby="verify-modal-title">
        <h2 id="verify-modal-title">要開一個新終端跑驗證嗎？</h2>
        <div>
          <button type="button" id="verify-modal-confirm" class="ds-btn ds-btn-primary">開終端驗證</button>
          <button type="button" id="verify-modal-later" class="ds-btn ds-btn-ghost">稍後</button>
        </div>
      </section>
    </div>

    <div id="behavior-fallback" hidden>
      <code id="behavior-question"></code>
      <button type="button" id="copy-behavior-question">複製</button>
      <ul id="behavior-checklist"></ul>
    </div>
    <textarea id="prompt" hidden></textarea>
    <input type="checkbox" id="allow-write" hidden />
    <script src="/vendor/lottie-light.min.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
