<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>jr-setup-ui</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <h1>jr-setup-ui</h1>
      <section class="env-check" aria-labelledby="env-title">
        <div class="env-heading">
          <div>
            <h2 id="env-title">環境檢查</h2>
            <p id="env-os">作業系統：檢查中…</p>
          </div>
          <button type="button" id="recheck-env">重新檢查</button>
        </div>
        <p id="install-status" class="install-status" hidden>
          安裝完成，狀態已更新。
        </p>
        <p id="login-wait-status" class="install-status" hidden></p>
        <div
          id="env-results"
          class="env-results"
          aria-live="polite"
          aria-busy="true"
        >
          <p class="env-message">檢查中…</p>
        </div>
      </section>
      <section class="config-install" aria-labelledby="config-title">
        <div class="env-heading">
          <div>
            <h2 id="config-title">規則檔安裝</h2>
            <div class="config-selects">
              <label>
                工具
                <select id="config-tools"></select>
              </label>
              <label>
                語言
                <select id="config-lang"></select>
              </label>
            </div>
          </div>
          <div class="config-buttons">
            <button type="button" id="recheck-configs">重新檢查</button>
            <button type="button" id="verify-configs">驗證安裝</button>
            <button type="button" id="verify-behavior">驗證回覆格式</button>
            <button type="button" id="verify-hook-live">驗證 hook 會擋</button>
          </div>
        </div>
        <p id="config-summary">尚未檢查</p>
        <div id="config-results" class="env-results" aria-live="polite">
          <p class="env-message">檢查中…</p>
        </div>
        <div
          id="behavior-fallback"
          class="login-hints behavior-fallback"
          hidden
        >
          <p>自動驗證沒過時，可以自己試一次。</p>
          <div class="login-code-row behavior-question-row">
            <code id="behavior-question"></code>
            <button type="button" id="copy-behavior-question">複製</button>
          </div>
          <ul id="behavior-checklist"></ul>
        </div>
      </section>
      <h2>固定步驟</h2>
      <div class="actions">
        <button type="button" data-action="hello">顯示問候</button>
        <button type="button" data-action="slow-count">慢速計數</button>
        <button type="button" data-action="fail-demo">失敗示範</button>
        <button type="button" data-action="claude-hello">Claude 問候</button>
        <button type="button" data-action="codex-hello">Codex 問候</button>
      </div>
      <h2>自由輸入</h2>
      <textarea
        id="prompt"
        maxlength="4000"
        placeholder="輸入要交給代理執行的內容"
      ></textarea>
      <div class="write-toggle">
        <label>
          <input type="checkbox" id="allow-write" />
          允許寫檔（預設關閉）
        </label>
        <small>關閉時只能讀取與查詢，不能建立或修改檔案。</small>
      </div>
      <div class="actions">
        <button type="button" data-action="claude-free">送給 Claude</button>
        <button type="button" data-action="codex-free">送給 Codex</button>
      </div>
      <div class="run-controls">
        <button type="button" id="cancel" hidden>取消</button>
      </div>
      <div id="login-hints" class="login-hints" hidden>
        <a
          id="login-url"
          target="_blank"
          rel="noopener noreferrer"
          hidden
        ></a>
        <div id="login-code-row" class="login-code-row" hidden>
          <span id="login-code"></span>
          <button type="button" id="copy-login-code">複製</button>
        </div>
      </div>
      <div id="output" role="log" aria-live="polite"></div>
      <form id="run-input" class="run-input" hidden>
        <input
          id="run-input-text"
          type="text"
          maxlength="500"
          autocomplete="off"
          placeholder="把授權代碼貼在這裡，再按送出"
          aria-label="送給執行中指令的文字"
        />
        <button type="submit">送出</button>
      </form>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
